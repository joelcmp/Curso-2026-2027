<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAOS.exe</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial Black,Impact,sans-serif;
}

body{
    perspective:600px;
}

/* ==================================================
   MUNDO
================================================== */

#world{
    position:absolute;
    width:140%;
    height:140%;
    left:-20%;
    top:-20%;

    background:
        radial-gradient(circle at 10% 20%,#ff00cc 0 4%,transparent 25%),
        radial-gradient(circle at 90% 15%,#00ffff 0 5%,transparent 25%),
        radial-gradient(circle at 80% 90%,#8b00ff 0 5%,transparent 28%),
        radial-gradient(circle at 15% 85%,#ff6600 0 4%,transparent 25%),
        conic-gradient(
            #ff006e,
            #7000ff,
            #00eaff,
            #00ff66,
            #ffe600,
            #ff3b00,
            #ff006e
        );

    filter:saturate(2.8);
    animation:
        worldSpin 18s linear infinite,
        worldZoom 3s ease-in-out infinite alternate,
        hue 11s linear infinite;
}

@keyframes worldSpin{
    to{transform:rotate(360deg)}
}

@keyframes worldZoom{
    from{scale:1}
    to{scale:1.25}
}

@keyframes hue{
    to{filter:hue-rotate(360deg) saturate(3)}
}

/* ==================================================
   GRID
================================================== */

#grid{
    position:absolute;
    width:250%;
    height:250%;
    left:-75%;
    top:-30%;

    background-image:
        linear-gradient(#00ffff44 2px,transparent 2px),
        linear-gradient(90deg,#ff00ff44 2px,transparent 2px);

    background-size:45px 45px;

    transform:
        perspective(350px)
        rotateX(70deg);

    animation:
        gridMove .55s linear infinite,
        gridTilt 3s ease-in-out infinite alternate;

    box-shadow:
        inset 0 0 150px #00ffff;
}

@keyframes gridMove{
    to{background-position:0 45px}
}

@keyframes gridTilt{
    from{rotate:-3deg}
    to{rotate:3deg}
}

/* ==================================================
   ONDAS
================================================== */

#waves{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.wave{
    position:absolute;
    left:50%;
    top:50%;

    border:5px solid;
    border-radius:50%;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 20px currentColor,
        0 0 60px currentColor,
        0 0 120px currentColor;

    animation:
        waveGrow var(--speed) linear infinite;
}

@keyframes waveGrow{
    0%{
        width:20px;
        height:20px;
        opacity:0;
        rotate:0deg;
    }

    15%{
        opacity:1;
    }

    100%{
        width:140vw;
        height:140vw;
        opacity:0;
        rotate:540deg;
    }
}

/* ==================================================
   CENTRO
================================================== */

#core{
    position:absolute;
    left:50%;
    top:50%;

    width:300px;
    height:300px;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);

    transform-style:preserve-3d;
}

.coreRing{
    position:absolute;
    left:50%;
    top:50%;

    border-radius:50%;
    border:8px solid;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 20px currentColor,
        0 0 50px currentColor,
        0 0 100px currentColor;

    animation:
        coreRotate var(--speed) linear infinite;
}

.coreRing:nth-child(1){
    width:100px;
    height:100px;
    color:#fff;
    --speed:.8s;
}

.coreRing:nth-child(2){
    width:180px;
    height:180px;
    color:#ff00cc;
    --speed:1.1s;
}

.coreRing:nth-child(3){
    width:260px;
    height:260px;
    color:#00ffff;
    --speed:1.4s;
}

.coreRing:nth-child(4){
    width:360px;
    height:360px;
    color:#ffff00;
    --speed:1.8s;
}

@keyframes coreRotate{
    from{
        rotate:0deg;
        transform:translate(-50%,-50%) rotateX(65deg);
    }
    to{
        rotate:360deg;
        transform:translate(-50%,-50%) rotateX(65deg);
    }
}

/* ==================================================
   TEXTO
================================================== */

#mainText{
    position:absolute;
    z-index:100;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-5deg);

    font-size:clamp(70px,16vw,230px);
    letter-spacing:-15px;
    color:#fff;

    text-shadow:
        10px 10px #ff0088,
        -10px -10px #00ffff,
        0 0 20px #fff,
        0 0 50px #ff00ff,
        0 0 100px #00ffff;

    animation:
        mainChaos 1.7s ease-in-out infinite alternate,
        mainHue 6s linear infinite;
}

@keyframes mainChaos{
    0%{
        transform:
            translate(-50%,-50%)
            rotate(-8deg)
            skewX(-10deg)
            scale(.85);
    }

    50%{
        transform:
            translate(-48%,-53%)
            rotate(8deg)
            skewX(15deg)
            scale(1.15);
    }

    100%{
        transform:
            translate(-53%,-47%)
            rotate(-4deg)
            skewX(-18deg)
            scale(.95);
    }
}

@keyframes mainHue{
    to{filter:hue-rotate(360deg)}
}

/* ==================================================
   GLITCH
================================================== */

#mainText:before,
#mainText:after{
    content:"CHAOS";
    position:absolute;
    inset:0;
}

#mainText:before{
    color:#00ffff;
    transform:translate(-12px,5px);
    clip-path:polygon(0 5%,100% 5%,100% 30%,0 30%);
    animation:glitch1 .45s infinite alternate;
}

#mainText:after{
    color:#ff0088;
    transform:translate(12px,-5px);
    clip-path:polygon(0 65%,100% 65%,100% 95%,0 95%);
    animation:glitch2 .6s infinite alternate;
}

@keyframes glitch1{
    from{translate:-15px 5px}
    to{translate:25px -12px}
}

@keyframes glitch2{
    from{translate:15px -5px}
    to{translate:-30px 15px}
}

/* ==================================================
   PARTÍCULAS
================================================== */

#particles{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
}

.p{
    position:absolute;

    width:var(--size);
    height:var(--size);

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 10px currentColor,
        0 0 30px currentColor,
        0 0 70px currentColor;

    animation:
        particle var(--time) linear infinite;
}

@keyframes particle{
    from{
        transform:
            translate3d(
                var(--x1),
                var(--y1),
                var(--z1)
            )
            rotate(0deg)
            scale(.1);
        opacity:0;
    }

    15%{opacity:1}

    85%{opacity:1}

    to{
        transform:
            translate3d(
                var(--x2),
                var(--y2),
                var(--z2)
            )
            rotate(900deg)
            scale(2);
        opacity:0;
    }
}

/* ==================================================
   OBJETOS GIRATORIOS
================================================== */

.shape{
    position:absolute;

    width:90px;
    height:90px;

    border:6px solid;

    box-shadow:
        0 0 20px currentColor,
        0 0 60px currentColor;

    animation:
        shapeMove var(--time) linear infinite;
}

@keyframes shapeMove{
    0%{
        transform:
            translate3d(0,0,0)
            rotateX(0)
            rotateY(0)
            rotateZ(0)
            scale(.3);
    }

    25%{
        transform:
            translate3d(var(--x),var(--y),300px)
            rotateX(360deg)
            rotateY(180deg)
            rotateZ(90deg)
            scale(1.7);
    }

    50%{
        transform:
            translate3d(
                calc(var(--x) * -1),
                calc(var(--y) * -1),
                -300px
            )
            rotateX(720deg)
            rotateY(360deg)
            rotateZ(270deg)
            scale(.5);
    }

    100%{
        transform:
            translate3d(0,0,0)
            rotateX(1080deg)
            rotateY(720deg)
            rotateZ(360deg)
            scale(.3);
    }
}

/* ==================================================
   TEXTO FLOTANTE
================================================== */

.floating{
    position:absolute;

    font-size:
        clamp(15px,3vw,45px);

    font-weight:900;

    color:var(--color);

    text-shadow:
        0 0 10px currentColor,
        0 0 30px currentColor,
        0 0 60px currentColor;

    white-space:nowrap;

    animation:
        float var(--time) ease-in-out infinite alternate,
        rotate var(--rot) linear infinite;
}

@keyframes float{
    from{
        transform:
            translate3d(0,0,0)
            scale(.4);
    }

    to{
        transform:
            translate3d(
                var(--x),
                var(--y),
                var(--z)
            )
            scale(2);
    }
}

@keyframes rotate{
    to{rotate:360deg}
}

/* ==================================================
   BARRAS
================================================== */

.bar{
    position:absolute;

    width:160%;
    height:10px;

    left:-30%;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff00cc,
            #00ffff,
            #ffff00,
            #00ff66,
            #ff00cc,
            transparent
        );

    background-size:300% 100%;

    box-shadow:
        0 0 20px #fff,
        0 0 50px #ff00ff;

    transform:rotate(var(--angle));

    animation:
        barRun var(--speed) linear infinite,
        barColor 4s linear infinite;
}

@keyframes barRun{
    from{translate:-30% 0}
    to{translate:30% 0}
}

@keyframes barColor{
    to{background-position:300% 0}
}

/* ==================================================
   BORDE GIRATORIO
================================================== */

#border{
    position:absolute;
    inset:20px;

    border:
        8px solid transparent;

    border-image:
        linear-gradient(
            90deg,
            #ff00cc,
            #00ffff,
            #ffff00,
            #00ff66,
            #ff00cc
        ) 1;

    animation:
        borderSpin 2s linear infinite;
}

@keyframes borderSpin{
    0%{
        transform:rotate(0deg) scale(1);
    }

    50%{
        transform:rotate(3deg) scale(1.04);
    }

    100%{
        transform:rotate(0deg) scale(1);
    }
}

/* ==================================================
   REDUCIR MOVIMIENTO
================================================== */

@media(prefers-reduced-motion:reduce){
    *,
    *:before,
    *:after{
        animation-duration:8s!important;
    }
}
</style>
</head>

<body>

<div id="world"></div>
<div id="grid"></div>

<div id="waves"></div>
<div id="particles"></div>

<div id="core">
    <div class="coreRing"></div>
    <div class="coreRing"></div>
    <div class="coreRing"></div>
    <div class="coreRing"></div>
</div>

<div id="border"></div>

<div id="mainText">CHAOS</div>

<script>

/* ============================================
   COLORES
============================================ */

const colors=[
    "#ff00cc",
    "#00ffff",
    "#ffff00",
    "#00ff55",
    "#ff6600",
    "#8b00ff",
    "#ffffff"
];

/* ============================================
   ONDAS
============================================ */

const waves=
    document.getElementById("waves");

for(let i=0;i<35;i++){

    const w=
        document.createElement("div");

    w.className="wave";

    w.style.color=
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];

    w.style.setProperty(
        "--speed",
        (.8+Math.random()*3)+"s"
    );

    w.style.animationDelay=
        (-Math.random()*4)+"s";

    waves.appendChild(w);
}

/* ============================================
   PARTÍCULAS
============================================ */

const particles=
    document.getElementById("particles");

for(let i=0;i<700;i++){

    const p=
        document.createElement("div");

    p.className="p";

    p.style.color=
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];

    p.style.left=
        Math.random()*100+"%";

    p.style.top=
        Math.random()*100+"%";

    p.style.setProperty(
        "--size",
        (2+Math.random()*11)+"px"
    );

    p.style.setProperty(
        "--x1",
        (Math.random()*80-40)+"vw"
    );

    p.style.setProperty(
        "--y1",
        (Math.random()*80-40)+"vh"
    );

    p.style.setProperty(
        "--z1",
        (Math.random()*1000-500)+"px"
    );

    p.style.setProperty(
        "--x2",
        (Math.random()*250-125)+"vw"
    );

    p.style.setProperty(
        "--y2",
        (Math.random()*250-125)+"vh"
    );

    p.style.setProperty(
        "--z2",
        (Math.random()*2000-1000)+"px"
    );

    p.style.setProperty(
        "--time",
        (.5+Math.random()*4)+"s"
    );

    p.style.animationDelay=
        (-Math.random()*5)+"s";

    particles.appendChild(p);
}

/* ============================================
   FORMAS
============================================ */

for(let i=0;i<70;i++){

    const s=
        document.createElement("div");

    s.className="shape";

    s.style.left=
        Math.random()*100+"%";

    s.style.top=
        Math.random()*100+"%";

    s.style.color=
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];

    s.style.setProperty(
        "--x",
        (Math.random()*1000-500)+"px"
    );

    s.style.setProperty(
        "--y",
        (Math.random()*1000-500)+"px"
    );

    s.style.setProperty(
        "--time",
        (1+Math.random()*4)+"s"
    );

    s.style.animationDelay=
        (-Math.random()*5)+"s";

    document.body.appendChild(s);
}

/* ============================================
   TEXTOS
============================================ */

const words=[
    "ERROR",
    "CHAOS",
    "VOID",
    "RUN",
    "404",
    "WTF",
    "HELP",
    "GLITCH",
    "OVERLOAD",
    "NULL",
    "HAHA",
    "SYSTEM",
    "CRITICAL",
    "010101",
    "???",
    "!!!",
    "NO ESCAPE",
    "WHY",
    "BOOM",
    "AAAAAAAA"
];

function spawnText(){

    const t=
        document.createElement("div");

    t.className="floating";

    t.textContent=
        words[
            Math.floor(
                Math.random()*words.length
            )
        ];

    t.style.left=
        Math.random()*100+"%";

    t.style.top=
        Math.random()*100+"%";

    t.style.setProperty(
        "--color",
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ]
    );

    t.style.setProperty(
        "--x",
        (Math.random()*800-400)+"px"
    );

    t.style.setProperty(
        "--y",
        (Math.random()*800-400)+"px"
    );

    t.style.setProperty(
        "--z",
        (Math.random()*1600-800)+"px"
    );

    t.style.setProperty(
        "--time",
        (.7+Math.random()*3)+"s"
    );

    t.style.setProperty(
        "--rot",
        (.5+Math.random()*3)+"s"
    );

    document.body.appendChild(t);

    setTimeout(
        ()=>t.remove(),
        4500
    );
}

setInterval(
    spawnText,
    90
);

/* ============================================
   CÁMARA DEL RATÓN
============================================ */

let mx=0;
let my=0;

document.addEventListener(
    "mousemove",
    e=>{

        mx=
            (e.clientX/
            innerWidth-.5)*2;

        my=
            (e.clientY/
            innerHeight-.5)*2;
    }
);

function camera(){

    const world=
        document.getElementById("world");

    world.style.transform=`
        translate(
            ${mx*30}px,
            ${my*30}px
        )
        scale(1.2)
    `;

    requestAnimationFrame(camera);
}

camera();

/* ============================================
   CAMBIOS CONTINUOS DE PERSPECTIVA
============================================ */

setInterval(()=>{

    document.body.style.perspective=
        (400+Math.random()*900)+"px";

},700);

/* ============================================
   CAMBIAR TÍTULO
============================================ */

const main=
    document.getElementById("mainText");

setInterval(()=>{

    const names=[
        "CHAOS",
        "ERROR",
        "VOID",
        "WTF",
        "999",
        "GLITCH"
    ];

    main.textContent=
        names[
            Math.floor(
                Math.random()*names.length
            )
        ];

},900);

</script>

</body>
</html>
