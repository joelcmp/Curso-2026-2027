<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Game Manager</title>
</head>
<body>
    <h2>Alta de Videojuego</h2>
    <form action="../php/manageGames.php" method="post">
        <label>Título:</label><br>
        <input type="text" name="title" maxlength="50"><br>
        <input type="hidden" name="accion" value="alta_juego">
        <button type="submit">Alta Juego</button> 
    </form>
    <a href="../php/manageGames.php">Ir a los juegos</a>

    <h2>Registrar Partida</h2>
    <form action="../php/managePlays.php" method="post">
        <label>Nombre del Jugador:</label><br>
        <input type="text" name="player" maxlength="50"><br><br>
        <label>ID del Juego:</label><br>
        <input type="number" name="id_game" min="1"><br><br>
        <input type="hidden" name="accion" value="alta_partida">
        <button type="submit">Registrar Partida</button>
    </form>
    <a href="../php/managePlays.php">Ir a las partidas</a>
</body>
</html>
