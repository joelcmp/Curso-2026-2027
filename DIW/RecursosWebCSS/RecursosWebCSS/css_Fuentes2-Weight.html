<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font-weight</title>
    <style>
        #font_weight_normal {
            Background-color:tomato;
            padding:5px;
            color:white;  
            font-weight:normal;
          }
          #font_weight_lighter {
            Background-color:aqua;
            padding:5px; 
            font-weight:lighter;
          }
          #font_weight_900 {
            Background-color:yellow;
            padding:5px;  
            font-weight:900;
          }
          #font_weight_100 {
            Background-color:powderblue;
            padding:5px;  
            font-weight:100;
          }
          #font_weight_bold {
            Background-color:green;
            color: orange;
            padding:5px;
            font-weight:bold;
          }
    </style>
</head>
<body>
    <h3>Grosor/peso de la letra</h3>
    <p id="font_weight_normal">Esta es una font-weight Normal </p>
    <p id="font_weight_lighter">Esta es una font-weight Lighter</p>
    <p id="font_weight_900">Esta es una font-weight Thickest </p>
    <p id="font_weight_100"> Esta es una font-weight Lightest</p>
    <p id="font_weight_bold">Esta es una font-weight Bold</p>
</body>
</html>
