<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Atrapa el Tesoro</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="cabecera">
        <h1>Atrapa el Tesoro</h1>
        <p>¡Recoge las monedas!</p>
    </div>

    <!-- PANEL DE CONFIGURACIÓN -->
    <div id="panel-config" class="panel">
        <h2>Configuración</h2>
        <div>
            <span>Velocidad de caída (1-10):</span>
            <input type="number" id="spin_velocidad" min="1" max="10" value="5">
        </div>
        <div>
            <span>Objetivo de monedas:</span>
            <input type="number" id="spin_objetivo" min="1" max="20" value="5">
        </div>
        <button id="btn_iniciar" class="btn">Iniciar Juego</button>
    </div>

    <!-- PANEL DE JUEGO -->
    <div id="panel-juego" class="panel">
        <div>
            <h2>¡Atrapa!</h2>
        </div>
        <div id="main">
            <div id="barra_control">
                <button id="btn_izquierda" class="btn">← Izquierda</button>
                <button id="btn_derecha" class="btn">Derecha →</button>
                <button id="btn_play" class="btn">Play</button>
                <button id="btn_stop" class="btn">Pausa</button>
                <button id="btn_acelerar" class="btn">Acelerar</button>
                <button id="btn_frenar" class="btn">Frenar</button>
                <button id="btn_reiniciar" class="btn">Reiniciar</button>
            </div>
            
            <div id="escenario">
                <div id="cesta"></div>
                <div id="moneda"></div>
            </div>

            <div id="panel_estadisticas">
                <h3>Estado del Juego</h3>
                <span>MONEDAS </span><span id="n_monedas">0</span>
                <br>
                <span>Puntos </span><span id="n_puntos">0</span>
                <span>Atrapadas </span><span id="n_atrapadas">0</span>
                <span>Perdidas </span><span id="n_perdidas">0</span>
                <p id="mensaje">¡Pulsa Iniciar!</p>
            </div>
        </div>
    </div>
</body>
</html>
