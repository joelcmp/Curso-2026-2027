<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Space Defender</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="cabecera">
        <h1>Space Defender</h1>
        <p>¡Protege la Tierra!</p>
    </div>

    <!-- PANEL DE CONFIGURACIÓN -->
    <div id="panel-config" class="panel">
        <h2>Configuración</h2>
        <div>
            <span>Número de disparos:</span>
            <input type="number" id="spin_disparos" min="1" max="20" value="5">
        </div>
        <div>
            <span>Velocidad nave enemiga (1-10):</span>
            <input type="number" id="spin_velocidad" min="1" max="10" value="5">
        </div>
        <button id="btn_iniciar" class="btn">Iniciar Defensa</button>
    </div>

    <!-- PANEL DE JUEGO -->
    <div id="panel-juego" class="panel">
        <div>
            <h2>Consola de Tiro</h2>
        </div>
        <div id="main">
            <div id="barra_control">
                <button id="btn_disparar" class="btn">Disparar</button>
                <button id="btn_play" class="btn">Play</button>
                <button id="btn_stop" class="btn">Pausa</button>
                <button id="btn_acelerar" class="btn">Acelerar</button>
                <button id="btn_frenar" class="btn">Frenar</button>
                <button id="btn_reiniciar" class="btn">Reiniciar</button>
            </div>
            
            <div id="escenario">
                <div id="naveEnemiga"></div>
                <div id="laser"></div>
                <div id="canon"></div>
            </div>

            <div id="panel_estadisticas">
                <h3>Estado de la Defensa</h3>
                <span>DISPAROS </span><span id="n_disparos">0</span>
                <br>
                <span>Puntos </span><span id="n_puntos">0</span>
                <span>Aciertos </span><span id="n_aciertos">0</span>
                <span>Fallos </span><span id="n_fallos">0</span>
                <p id="mensaje">¡Pulsa Disparar!</p>
            </div>
        </div>
    </div>
</body>
</html>
