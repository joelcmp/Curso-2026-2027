<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../SimForest/styles/styles.css" />
  <script src="../SimForest/script/script.js" defer></script>
  <title>SimForest</title>
</head>

<body>
  <main>
    <h1>SimForest</h1>

    <section id="panel_config">
      <form id="form_config">
        <div id="dimensiones">
          <label for="filas">Filas</label>
          <input id="filas" name="filas" class="imp" type="number" min="1" step="1" required placeholder="0" />
          <label for="columnas">Columnas</label>
          <input id="columnas" name="columnas" class="imp" type="number" min="1" step="1" required placeholder="0" />
        </div>
        <div id="probabilidad_estado">
          <label for="p_nacimiento">Probabilidad nacimiento árbol (0-1)</label>
          <input id="p_nacimiento" name="p_nacimiento" class="imp" type="number" min="0" max="1" step="0.01" required
            placeholder="0" />
          <label for="p_incendio">Probabilidad de incendio (0-1)</label>
          <input id="p_incendio" name="p_incendio" class="imp" type="number" min="0" max="1" step="0.01" required
            placeholder="0" />
        </div>
      </form>

      <button type="button" id="btn_iniciar" class="btn_iniciar_simulacion">Iniciar simulación</button>
    </section>

    <section id="panel_simulador" class="oculto">
      <div id="tablero"></div>

      <div id="controles">
        <button type="button" title="Retroceder">&#9194;</button>
        <button type="button" title="Reproducir">&#9658;</button>
        <button type="button" title="Pausa">&#10074;&#10074;</button>
        <button type="button" title="Detener">&#9632;</button>
        <button type="button" title="Avanzar" id="avanzar">&#9193;</button>
      </div>
    </section>
  </main>
</body>

</html>
